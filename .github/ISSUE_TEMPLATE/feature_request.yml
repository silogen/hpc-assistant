name: Feature Request
description: Suggest an enhancement for HPC Assistant
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you are trying to solve and the change you would
        like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What limitation or pain point does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the project address it?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup / launch scripts
        - Skills
        - Knowledge base (RAG / MCP)
        - Inference proxy
        - Container images / CI
        - Documentation
        - Other
    validations:
      required: true
